name: Extract wizard functions
on:
  push:
    branches: [main]
    paths:
      - "tools/extract_wizard_functions.py"
      - ".github/workflows/extract-wizard-functions.yml"
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/extract_wizard_functions.py
