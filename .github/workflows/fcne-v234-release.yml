name: FCNE v2.34 release assembly
on:
  push:
    branches: [release-v234-halle-feld-20261030]
    paths: ['.github/workflows/fcne-v234-release.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-v234-halle-feld-20261030
          persist-credentials: true
      - name: Integrate tested Halle/Feld fixes into original v2.31 app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path('index.html')
          html=app.read_text(encoding='utf-8')
          modules=['fcne-modefix-v234.js','fcne-swap-ui-v234.js','fcne-hall-game-v234.js','fcne-swap-lock-v234.js']
          assert len(html)>5_000_000, 'Unexpected app size'
          assert html.count('</body>')==1, 'Unexpected HTML structure'
          assert 'fcne-v21-easy-subbranches' in html
          assert 'fcne-v22-spielform-fix' in html
          assert 'const E2C=' in html
          assert 'fcne-swap-lock-v234.js?v=' not in html
          for name in modules:
              assert Path(name).is_file(), 'Missing module: '+name
          html=html.replace('Version 2.31 CLEAN','Version 2.34 · Halle/Feld-Fix')
          html=html.replace("window.FCNE_APP_VERSION='2.31 CLEAN'","window.FCNE_APP_VERSION='2.34 HALLE/FELD'")
          scripts='\\n'.join('<script src="./'+name+'?v=20261030-234"></script>' for name in modules)
          html=html.replace('</body>', '<!-- Stable v2.31 CLEAN base + reviewed Halle/Feld v2.34 fixes -->\\n'+scripts+'\\n</body>')
          assert html.count('fcne-swap-lock-v234.js?v=')==1
          app.write_text(html,encoding='utf-8')
          print('FCNE v2.34 HTML assembled; bytes:',app.stat().st_size)
          PY
          for f in fcne-modefix-v234.js fcne-swap-ui-v234.js fcne-hall-game-v234.js fcne-swap-lock-v234.js sw.js; do node --check "$f"; done
      - name: Commit assembled index on staging branch
        shell: bash
        run: |
          git config user.name "FCNE release bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Assemble v2.34 Halle/Feld production index from stable v2.31"
          git push origin HEAD:release-v234-halle-feld-20261030
