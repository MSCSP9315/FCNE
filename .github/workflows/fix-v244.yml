name: Apply v2.44 MH UI fix
on:
  push:
    branches: [main]
    paths:
      - "tools/fix_v244.py"
      - ".github/workflows/fix-v244.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/fix_v244.py
      - name: Validate patch
        run: |
          grep -q "fcne-v244-ui" index.html
          grep -q "2.44 MH-UI-FIX" index.html
          grep -q "v2.44-mh-ui-fix" sw.js
      - name: Commit v2.44
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Apply v2.44 MH UI and opening fix"
            git push
          fi
