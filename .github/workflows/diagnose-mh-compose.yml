name: Diagnose MH compose
on:
  push:
    branches: [main]
    paths:
      - "tools/diagnose_mh_compose.py"
      - ".github/workflows/diagnose-mh-compose.yml"
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/diagnose_mh_compose.py
