name: Apply v2.48 MH wizard flow fix
on:
  push:
    branches: [main]
    paths:
      - "tools/fix_v248.py"
      - "tools/smoke_v248.py"
      - ".github/workflows/fix-v248.yml"
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/fix_v248.py
      - name: Validate static patch
        run: |
          grep -q "fcne-v248-mh-wizard" index.html
          grep -q "2.48 MH-WIZARD-FLOW" index.html
          grep -q "v2.48-mh-wizard-flow" sw.js
          python - <<'PY'
          import json
          d=json.load(open("mh_library.json",encoding="utf-8"))
          cats={}
          for e in d["exercises"]: cats[e["category"]]=cats.get(e["category"],0)+1
          assert cats.get("Vielseitigkeit",0)>=5, cats
          print(cats)
          PY
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Full MH flow browser test
        run: python tools/smoke_v248.py
      - name: Commit v2.48
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js mh_library.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Apply v2.48 MH wizard flow fix"
            git push
          fi
